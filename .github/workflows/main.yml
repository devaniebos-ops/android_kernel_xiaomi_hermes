name: Build Kernel Hermes - Full NS Final Fix v3

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # 1. FIX CMDQ
        find drivers/misc/mediatek/cmdq/v2/ -name "Makefile" -exec sed -i 's|ccflags-y += -I|ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2/mt6795/ -I|g' {} +
        
        # 2. FIX CGROUP
        sed -i 's/cred->euid != tcred->uid/!uid_eq(cred->euid, tcred->uid)/g' kernel/cgroup.c
        sed -i 's/cred->euid != tcred->suid/!uid_eq(cred->euid, tcred->suid)/g' kernel/cgroup.c

        # 3. SAPU BERSIH SDCARDFS (Assignment & Comparison)
        # Fix Header & Inode (Assignment)
        sed -i 's/(x)->i_uid = SDCARDFS_I(x)->data->d_uid/(x)->i_uid = make_kuid(current_user_ns(), SDCARDFS_I(x)->data->d_uid)/g' fs/sdcardfs/sdcardfs.h
        sed -i 's/(x)->i_gid = AID_SDCARD_RW/(x)->i_gid = make_kgid(current_user_ns(), AID_SDCARD_RW)/g' fs/sdcardfs/sdcardfs.h
        sed -i 's/cred->fsuid = uid/cred->fsuid = make_kuid(current_user_ns(), uid)/g' fs/sdcardfs/inode.c
        sed -i 's/cred->fsgid = sbi->options.fs_low_gid/cred->fsgid = make_kgid(current_user_ns(), sbi->options.fs_low_gid)/g' fs/sdcardfs/inode.c
        sed -i 's/attrs.ia_uid = uid/attrs.ia_uid = make_kuid(current_user_ns(), uid)/g' fs/sdcardfs/sdcardfs.h
        sed -i 's/attrs.ia_gid = gid/attrs.ia_gid = make_kgid(current_user_ns(), gid)/g' fs/sdcardfs/sdcardfs.h
        
        # Fix packagelist.c (Comparison with 0/root)
        sed -i 's/current_fsuid() == 0/uid_eq(current_fsuid(), GLOBAL_ROOT_UID)/g' fs/sdcardfs/packagelist.c
        
        # Fix derived_perm.c (Comparison with variables)
        sed -i 's/i_gid != gid/!gid_eq(path.dentry->d_inode->i_gid, make_kgid(current_user_ns(), gid))/g' fs/sdcardfs/derived_perm.c
        sed -i 's/i_uid != uid/!uid_eq(path.dentry->d_inode->i_uid, make_kuid(current_user_ns(), uid))/g' fs/sdcardfs/derived_perm.c

        make hermes_defconfig

        # --- AKTIFKAN FULL NAMESPACE ---
        echo "CONFIG_NAMESPACES=y" >> .config
        echo "CONFIG_UTS_NS=y" >> .config
        echo "CONFIG_IPC_NS=y" >> .config
        echo "CONFIG_PID_NS=y" >> .config
        echo "CONFIG_NET_NS=y" >> .config
        echo "CONFIG_USER_NS=y" >> .config
        
        make olddefconfig
        make -j$(nproc) KCFLAGS="-w"
        
    - name: Check Output
      if: always()
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ AKHIRNYA TEMBUS! KERNEL NAMESPACE SUKSES!"
        else
          echo "❌ MASIH ADA ERROR! Menampilkan error terbaru:"
          make -j1 KCFLAGS="-w" 2>&1 | grep "error:" | head -n 5
          exit 1
        fi

    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-FullNS-Final-v3
        path: arch/arm64/boot/Image.gz-dtb
