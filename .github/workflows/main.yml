name: Build Kernel Hermes - Incremental Fast Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Cache Toolchain
      uses: actions/cache@v4
      with:
        path: toolchain
        key: toolchain-hermes-v1

    - name: Download Toolchain
      if: steps.cache-toolchain.outputs.cache-hit != 'true'
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    # --- INI KUNCI AGAR START DARI PROGRESS SEBELUMNYA ---
    - name: Cache Build Progress
      uses: actions/cache@v4
      with:
        path: |
          .config
          **/*.o
          **/*.o.cmd
          **/*.a
          **/*.s
        # Key ini akan berubah setiap kali kamu push, tapi tetap mengambil dari cache sebelumnya (restore-keys)
        key: kernel-build-${{ github.sha }}
        restore-keys: |
          kernel-build-

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # FIX CMDQ
        find drivers/misc/mediatek/cmdq/v2/ -name "Makefile" -exec sed -i 's|ccflags-y += -I|ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2/mt6795/ -I|g' {} +
        
        # Hanya buat defconfig jika .config tidak ada (dari cache)
        if [ ! -f .config ]; then
          make hermes_defconfig
          echo "CONFIG_NAMESPACES=y" >> .config
          echo "CONFIG_UTS_NS=y" >> .config
          echo "CONFIG_IPC_NS=y" >> .config
          echo "CONFIG_PID_NS=y" >> .config
          echo "CONFIG_NET_NS=y" >> .config
          echo "CONFIG_USER_NS=y" >> .config
          make olddefconfig
        fi
        
        # Build lanjutin sisa file .o yang belum ada
        make -j$(nproc) KCFLAGS="-w" || make -j1 KCFLAGS="-w"
        
    - name: Check Output
      if: always()
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ AKHIRNYA TEMBUS! KERNEL NAMESPACE SUKSES!"
        else
          echo "❌ ERROR TERDETEKSI!"
          # Jalankan j1 sebentar buat nangkep error spesifik
          make -j1 KCFLAGS="-w" 2>&1 | grep "error:" | head -n 20
          exit 1
        fi

    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-FullNS-Final
        path: arch/arm64/boot/Image.gz-dtb
