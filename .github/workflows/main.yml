name: Build Kernel Hermes - Final Phase USER_NS

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # 1. FIX CMDQ (Wajib)
        find drivers/misc/mediatek/cmdq/v2/ -name "Makefile" -exec sed -i 's|ccflags-y += -I|ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2/mt6795/ -I|g' {} +
        
        # 2. PATCH OTOMATIS: Memperbaiki perbandingan UID/GID yang rusak akibat USER_NS
        # Kita incar pola yang paling sering error di cgroup dan drivers
        find . -type f -name "*.c" -exec sed -i 's/\([^ ]*\)->euid != \([^ ]*\)->uid/!uid_eq(\1->euid, \2->uid)/g' {} +
        find . -type f -name "*.c" -exec sed -i 's/\([^ ]*\)->uid != \([^ ]*\)->uid/!uid_eq(\1->uid, \2->uid)/g' {} +

        make hermes_defconfig

        # --- AKTIFKAN SEMUA NAMESPACE ---
        echo "CONFIG_NAMESPACES=y" >> .config
        echo "CONFIG_UTS_NS=y" >> .config
        echo "CONFIG_IPC_NS=y" >> .config
        echo "CONFIG_PID_NS=y" >> .config
        echo "CONFIG_NET_NS=y" >> .config
        echo "CONFIG_USER_NS=y" >> .config
        
        make olddefconfig
        
        # Kita pakai -j2 tapi jika gagal kita akan coba tangkap errornya
        make -j$(nproc) KCFLAGS="-w" || (make -j1 KCFLAGS="-w" 2>&1 | grep "error:")
        
    - name: Check Output
      if: always()
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ MISI SELESAI: KERNEL FULL NAMESPACE SUKSES!"
        else
          echo "❌ GAGAL DI USER_NS! Masih ada kode yang butuh uid_eq manual."
          exit 1
        fi

    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-Full-NS
        path: arch/arm64/boot/Image.gz-dtb
