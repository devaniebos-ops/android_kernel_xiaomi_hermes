name: Build Kernel Hermes

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu gcc-multilib g++-multilib

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        make clean
        make mrproper
        make hermes_defconfig
        
        # Kita simpan output ke file build.log untuk dianalisa jika gagal
        make -j$(nproc) KCFLAGS="-w" 2>&1 | tee build.log
        
    - name: Check Output
      if: always()
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ KERNEL BERHASIL!"
        else
          echo "❌ KERNEL GAGAL! Menampilkan 50 baris terakhir log error:"
          tail -n 50 build.log
          exit 1
        fi

    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-Original
        path: arch/arm64/boot/Image.gz-dtb
