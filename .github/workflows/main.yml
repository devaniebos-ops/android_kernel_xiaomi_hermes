name: Build Kernel Hermes - Full NS Debugging

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # 1. FIX CMDQ (Wajib buat MT6795)
        find drivers/misc/mediatek/cmdq/v2/ -name "Makefile" -exec sed -i 's|ccflags-y += -I|ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2/mt6795/ -I|g' {} +
        
        make hermes_defconfig

        # 2. AKTIFKAN FULL NAMESPACE (Konfigurasi yang kamu mau)
        echo "CONFIG_NAMESPACES=y" >> .config
        echo "CONFIG_UTS_NS=y" >> .config
        echo "CONFIG_IPC_NS=y" >> .config
        echo "CONFIG_PID_NS=y" >> .config
        echo "CONFIG_NET_NS=y" >> .config
        echo "CONFIG_USER_NS=y" >> .config
        
        make olddefconfig
        
        # 3. BUILD DENGAN MODE TANGKAP ERROR
        # Kita pakai nproc dulu biar cepat, kalau gagal baru lari ke j1
        make -j$(nproc) KCFLAGS="-w" || make -j1 KCFLAGS="-w"
        
    - name: Check Output
      if: always()
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ AKHIRNYA TEMBUS! KERNEL NAMESPACE SUKSES!"
        else
          echo "❌ ERROR TERDETEKSI!"
          echo "Sedang mencari baris error yang menyebabkan build berhenti..."
          # Jalankan ulang j1 untuk memastikan error tertangkap di log paling bawah
          make -j1 KCFLAGS="-w" 2>&1 | grep "error:" | head -n 20
          exit 1
        fi

    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-FullNS-Debug
        path: arch/arm64/boot/Image.gz-dtb
