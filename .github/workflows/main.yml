name: Build Kernel Hermes - Manual Debug

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Manual Compile & Inspect
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        make hermes_defconfig
        
        echo "--- STEP 1: Cek folder drivers ---"
        ls -F drivers/ | grep "/"
        
        echo "--- STEP 2: Mencoba kompilasi folder drivers secara paksa ---"
        # Kita paksa hanya build folder drivers untuk melihat error spesifiknya
        make drivers/ V=1 KCFLAGS="-w" 2>&1 | tee manual_debug.log || true
        
        echo "--- STEP 3: Analisa 100 baris error drivers ---"
        tail -n 100 manual_debug.log
