name: Build Kernel Hermes

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-22.04 # Versi paling stabil untuk library i386
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libc6-i386 lib32stdc++6 lib32z1 binutils-aarch64-linux-gnu libncurses5 libncurses5:i386 libstdc++6:i386

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # Bersihkan sisa build
        make clean
        make mrproper
        
        # Konfigurasi defconfig Hermes
        make hermes_defconfig
        
        # --- AUTO-INJECT NAMESPACE (FIX UNTUK VNC/CHROOT) ---
        sed -i 's/# CONFIG_NAMESPACES is not set/CONFIG_NAMESPACES=y/' .config
        {
          echo "CONFIG_UTS_NS=y"
          echo "CONFIG_IPC_NS=y"
          echo "CONFIG_USER_NS=y"
          echo "CONFIG_PID_NS=y"
          echo "CONFIG_NET_NS=y"
        } >> .config
        
        # Mulai kompilasi
        make -j$(nproc)

    - name: Check Output
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ KERNEL BERHASIL DI-BUILD!"
        else
          echo "❌ KERNEL TIDAK DITEMUKAN!"
          exit 1
        fi

    - name: Upload Kernel
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-Update
        path: arch/arm64/boot/Image.gz-dtb
