name: Build Kernel Hermes

on:
  workflow_dispatch: # Jalankan manual dari tab Actions

jobs:
  build:
    runs-on: ubuntu-22.04 # Gunakan 22.04 untuk stabilitas library lama
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4 # Versi terbaru
      with:
        ref: lineage-16.0 # Memastikan branch yang benar

    - name: Install Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libc6-i386 lib32ncurses5 lib32z1 lib32stdc++6 binutils-aarch64-linux-gnu libncurses5

    - name: Download Toolchain
      run: |
        # Download GCC 4.9 dari mirror yang stabil
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # Bersihkan sisa build sebelumnya jika ada
        make clean
        make mrproper
        
        # Gunakan config bawaan Hermes
        make hermes_defconfig
        
        # --- MODIFIKASI CONFIG UNTUK NAMESPACE (VNC FIX) ---
        sed -i 's/# CONFIG_NAMESPACES is not set/CONFIG_NAMESPACES=y/' .config
        {
          echo "CONFIG_UTS_NS=y"
          echo "CONFIG_IPC_NS=y"
          echo "CONFIG_USER_NS=y"
          echo "CONFIG_PID_NS=y"
          echo "CONFIG_NET_NS=y"
        } >> .config
        
        # Mulai kompilasi menggunakan semua core CPU yang tersedia
        make -j$(nproc)

    - name: Check for Output
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ Kernel Berhasil Dibuat!"
        else
          echo "❌ Kernel Gagal Dibuat. Cek log di atas."
          exit 1
        fi

    - name: Upload Kernel Artifact
      uses: actions/upload-artifact@v4 # VERSI TERBARU (Anti-Error)
      with:
        name: Kernel-Hermes-Update
        path: arch/arm64/boot/Image.gz-dtb
