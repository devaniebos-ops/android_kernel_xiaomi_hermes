name: Build Kernel Hermes - Debug UID Manual

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Manual Debugging
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # 1. Setup Config dengan USER_NS Aktif
        make hermes_defconfig
        echo "CONFIG_NAMESPACES=y" >> .config
        echo "CONFIG_USER_NS=y" >> .config
        make olddefconfig

        echo "--- ANALISA 1: kernel/cgroup.c ---"
        # Menampilkan baris yang error kemarin (sekitar baris 2170)
        sed -n '2160,2180p' kernel/cgroup.c
        
        echo "--- ANALISA 2: fs/sdcardfs/sdcardfs.h ---"
        # Menampilkan baris yang error kemarin (sekitar baris 540-620)
        sed -n '540,550p;610,620p' fs/sdcardfs/sdcardfs.h

        echo "--- TEST COMPILE: kernel/cgroup.o ---"
        make kernel/cgroup.o KCFLAGS="-w" || true

        echo "--- TEST COMPILE: fs/sdcardfs/dentry.o ---"
        make fs/sdcardfs/dentry.o KCFLAGS="-w" || true
