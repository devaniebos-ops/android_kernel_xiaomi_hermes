name: Build Kernel Hermes - Phase 1 Namespace Fix

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    steps:
    - name: Checkout Source
      uses: actions/checkout@v4
      with:
        ref: lineage-16.0

    - name: Install Dependencies
      run: |
        sudo dpkg --add-architecture i386
        sudo apt-get update
        sudo apt-get install -y bc build-essential zip curl libssl-dev libssl-dev:i386 flex bison libncurses5-dev libncurses5 libncurses5:i386 binutils-aarch64-linux-gnu

    - name: Download Toolchain
      run: |
        git clone https://github.com/lineageos/android_prebuilts_gcc_linux-x86_aarch64_aarch64-linux-android-4.9 toolchain --depth=1

    - name: Build Kernel
      run: |
        export ARCH=arm64
        export CROSS_COMPILE=$(pwd)/toolchain/bin/aarch64-linux-android-
        
        # FIX CMDQ
        find drivers/misc/mediatek/cmdq/v2/ -name "Makefile" -exec sed -i 's|ccflags-y += -I|ccflags-y += -I$(srctree)/drivers/misc/mediatek/cmdq/v2/mt6795/ -I|g' {} +
        
        make hermes_defconfig

        # --- AKTIFKAN NAMESPACE TAHAP 1 ---
        # Kita pakai KCONFIG_ALLCONFIG atau langsung timpa .config
        echo "CONFIG_NAMESPACES=y" >> .config
        echo "CONFIG_UTS_NS=y" >> .config
        echo "CONFIG_IPC_NS=y" >> .config
        echo "CONFIG_PID_NS=y" >> .config
        # Kita pastikan USER_NS mati dulu di fase ini agar tidak error UID
        echo "# CONFIG_USER_NS is not set" >> .config
        
        # INI KUNCINYA: Memproses perubahan .config secara otomatis
        make olddefconfig
        
        make -j$(nproc) KCFLAGS="-w"
        
    - name: Check Output
      if: always()
      run: |
        if [ -f arch/arm64/boot/Image.gz-dtb ]; then
          echo "✅ KERNEL NAMESPACE PHASE 1 SUKSES!"
        else
          echo "❌ GAGAL! Cek log error di atas."
          exit 1
        fi

    - name: Upload Kernel
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: Kernel-Hermes-NS-Phase1
        path: arch/arm64/boot/Image.gz-dtb
